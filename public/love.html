    <h1>給你的一句愛的拍拍</h1>

  <section class="deck love-deck" aria-label="抽一句愛">

          <img class="love-stamp" src="/assets/love-seal.webp" alt="" aria-hidden="true">
        </div>
      </div>
    </div>
    <div class="love-acts">
      <button class="btn btn-primary" id="drawBtn" type="button">抽一張</button>
      <button class="btn btn-ghost" id="loveSave" type="button" hidden>存成圖片</button>
    </div>
  </section>

  <!-- IG／FB／LINE 內建瀏覽器不能下載：跳出圖片讓客人長按儲存 -->

    <div class="love-sheet-panel">
      <img class="love-img" id="loveImg" alt="">
      <p class="love-tip">長按圖片，選「儲存圖片」，再到 IG 限時動態選這張就能分享。</p>
